name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - mik/main
  pull_request:
  workflow_dispatch:

jobs:
  django:
    name: Django monolith checks
    runs-on: ubuntu-latest
    env:
      SKIP_FOOTBALL_IMPORT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test --verbosity 2

  microservices:
    name: Microservice tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            path: services/auth_service
          - name: ticketing
            path: services/ticketing_service/ticketing_fastapi
          - name: payment
            path: services/payment_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service.path }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service.path }}
        run: pytest -q

  docker:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs:
      - django
      - microservices
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f services/docker-compose.yml config

      - name: Build compose images
        run: docker compose -f services/docker-compose.yml build
